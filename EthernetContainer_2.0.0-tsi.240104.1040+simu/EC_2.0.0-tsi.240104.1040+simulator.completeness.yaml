########################################################################################################################
#   Common Components
########################################################################################################################
components:
  parameters:
    user:
      name: user
      in: header
      required: true
      schema:
        type: string
        example: 'User Name'
      description: 'User identifier from the system starting the service call'
    originator:
      name: originator
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        example: 'Resolver'
      description: >
        'Identification for the system consuming the API, as defined in
         [/core-model-1-4:control-construct/logical-termination-point={uuid}/layer-protocol=0/http-client-interface-1-0:http-client-interface-pac/http-client-interface-configuration/application-name]'
    x-correlator:
      name: x-correlator
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
        description: 'Empty string accepted from external applications.'
        example: '550e8400-e29b-11d4-a716-446655440000'
      description: 'UUID for the service execution flow that allows to correlate requests and responses'
    trace-indicator:
      name: trace-indicator
      in: header
      required: true
      schema:
        type: string
        pattern: '^([0-9]+)(\.([0-9]+))*$'
        description: 'Empty string accepted from external applications.'
        example: '1.3.1'
      description: 'Sequence of request numbers along the flow'
    customer-journey:
      name: customer-journey
      in: header
      required: true
      schema:
        type: string
        example: 'Unknown value'
      description: 'Holds information supporting customer’s journey to which the execution applies'
    mountName:
      name: mountName
      in: path
      required: true
      schema:
        type: string
        example: '222250001'
      description: 'The mountName of the device that is addressed by the request'
    uuid:
      name: uuid
      in: path
      required: true
      schema:
        type: string
        example: 'LTP-MWPS-TTP-1-1'
      description: 'Instance identifier that is unique within the device'
    uuid1:
      name: uuid1
      in: path
      required: true
      schema:
        type: string
        example: 'LTP-MWPS-TTP-1-1'
      description: 'Another instance identifier that is unique within the device'
    localId:
      name: localId
      in: path
      required: true
      schema:
        type: string
        example: 'LP-MWPS-TTP-1-1'
      description: 'Instance identifier that is unique within its list'
    fields:
      name: fields
      in: query
      required: false
      schema:
        type: string
        example: 'node(node-id;netconf-node-topology:connection-status)'
      description: 'Query parameter to filter ressources according to RFC8040 fields filter spec'
  responses:
    responseForErroredServiceRequests:
      description: 'Response in case of errored service requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
      headers:
        x-correlator:
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
            example: '550e8400-e29b-11d4-a716-446655440000'
          description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
        exec-time:
          schema:
            type: integer
            example: 1100
          description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
        backend-time:
          schema:
            type: integer
            example: 850
          description: 'Value written by the service provider, reporting the elapsed time for data retrieval from the backend (service invocation, database access…). Expressed in milliseconds'
    responseForErroredOamRequests:
      description: 'Response in case of errored OaM requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
  headers:
    x-correlator:
      schema:
        type: string
        example: '550e8400-e29b-11d4-a716-446655440000'
      description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
    exec-time:
      schema:
        type: integer
        example: 1100
      description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
    backend-time:
      schema:
        type: integer
        example: 850
      description: 'Value written by the service provider, reporting the elapsed time for data retrieval from the backend (service invocation, database access…). Expressed in milliseconds'
    life-cycle-state:
      schema:
        type: string
        enum:
          - 'EXPERIMENTAL'
          - 'OPERATIONAL'
          - 'DEPRECATED'
          - 'OBSOLETE'
          - 'UNKNOWN'
          - 'NOT_YET_DEFINED'
        example: 'EXPERIMENTAL'
  schemas:
    errorDescription:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string

    ethernet-container-capability:
      type: object
      required:
        - available-queue-list
        - dropping-behavior-configuration-is-avail
        - wred-profile-configuration-is-avail
        - scheduler-kind-configuration-is-avail
        - scheduler-profile-configuration-is-avail
        - explicit-congestion-notification-is-avail
        - ingress-policing-is-avail
        - egress-shaping-is-avail
        - bundling-is-avail
        - bundling-group-size-max
        - support-of-management-frames-without-preamble-is-avail
        - supported-header-compression-kind-list
        - fec-is-avail
        - fec-word-size-max
        - encryption-is-avail
        - admin-shut-down-is-avail
        - maintenance-timer-range
        - statistics-is-avail
        - performance-monitoring-is-avail
      properties:
        available-queue-list:
          type: array
          minItems: 1
          maxItems: 8
          x-key: queue-name
          items:
            type: object
            required:
              - queue-name
              - wred-profile-per-drop-precedence-is-available
            properties:
              queue-name:
                type: string
                enum:
                  - 'ethernet-container-2-0:QUEUE_NAME_TYPE_BEST_EFFORT_QUEUE'
                  - 'ethernet-container-2-0:QUEUE_NAME_TYPE_ASSURED_FORWARDING_QUEUE1'
                  - 'ethernet-container-2-0:QUEUE_NAME_TYPE_ASSURED_FORWARDING_QUEUE2'
                  - 'ethernet-container-2-0:QUEUE_NAME_TYPE_ASSURED_FORWARDING_QUEUE3'
                  - 'ethernet-container-2-0:QUEUE_NAME_TYPE_ASSURED_FORWARDING_QUEUE4'
                  - 'ethernet-container-2-0:QUEUE_NAME_TYPE_EXPEDITED_FORWARDING_QUEUE'
                  - 'ethernet-container-2-0:QUEUE_NAME_TYPE_CLASS_SELECTOR_QUEUE6'
                  - 'ethernet-container-2-0:QUEUE_NAME_TYPE_CLASS_SELECTOR_QUEUE7'
                  - 'ethernet-container-2-0:QUEUE_NAME_TYPE_QUEUENAME_NOT_YET_DEFINED'
              supported-queue-depth-list:
                type: array
                minItems: 0
                items:
                  type: integer
                  format: int32
              available-dropping-behavior-kind-list:
                type: array
                minItems: 0
                items:
                  type: string
                  enum:
                    - 'ethernet-container-2-0:DROPPING_BEHAVIOR_KIND_TYPE_DROP_TAIL'
                    - 'ethernet-container-2-0:DROPPING_BEHAVIOR_KIND_TYPE_RED'
                    - 'ethernet-container-2-0:DROPPING_BEHAVIOR_KIND_TYPE_WRED'
                    - 'ethernet-container-2-0:DROPPING_BEHAVIOR_KIND_TYPE_NOT_YET_DEFINED'
              available-drop-precedence-kind-list:
                type: array
                minItems: 0
                items:
                  type: string
                  enum:
                    - 'ethernet-container-2-0:DROP_PRECEDENCE_TYPE_ALL'
                    - 'ethernet-container-2-0:DROP_PRECEDENCE_TYPE_LOW'
                    - 'ethernet-container-2-0:DROP_PRECEDENCE_TYPE_MEDIUM'
                    - 'ethernet-container-2-0:DROP_PRECEDENCE_TYPE_HIGH'
                    - 'ethernet-container-2-0:DROP_PRECEDENCE_TYPE_NOT_YET_DEFINED'
              wred-profile-per-drop-precedence-is-available:
                type: boolean
              available-scheduling-kind-list:
                type: array
                minItems: 0
                items:
                  type: string
                  enum:
                    - 'ethernet-container-2-0:SCHEDULER_KIND_TYPE_STRICT'
                    - 'ethernet-container-2-0:SCHEDULER_KIND_TYPE_WFQ'
                    - 'ethernet-container-2-0:SCHEDULER_KIND_TYPE_WRR'
                    - 'ethernet-container-2-0:SCHEDULER_KIND_TYPE_DWRR'
                    - 'ethernet-container-2-0:SCHEDULER_KIND_TYPE_NOT_YET_DEFINED'
        dropping-behavior-configuration-is-avail:
          type: boolean
        wred-profile-configuration-is-avail:
          type: boolean
        scheduler-kind-configuration-is-avail:
          type: boolean
        scheduler-profile-configuration-is-avail:
          type: boolean
        supported-wred-protocol-list:
          type: array
          minItems: 0
          items:
            type: string
            enum:
              - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_NONE'
              - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_ETHERNET_MAC'
              - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_VLAN'
              - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_Q_IN_Q'
              - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_MPLS'
              - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_IPV4'
              - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_IPV6'
              - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_TCP'
              - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_UDP'
              - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_RTP'
              - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_GTP_U'
              - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_OTHERS'
              - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_NOT_YET_DEFINED'
        explicit-congestion-notification-is-avail:
          type: boolean
        ingress-policing-is-avail:
          type: boolean
        egress-shaping-is-avail:
          type: boolean
        supported-maximum-information-rate-list:
          type: array
          minItems: 0
          items:
            type: integer
            format: int32
        supported-maximum-burst-size-list:
          type: array
          minItems: 0
          items:
            type: integer
            format: int16
        bundling-is-avail:
          type: boolean
        bundling-group-size-max:
          type: integer
          format: int8
        support-of-management-frames-without-preamble-is-avail:
          type: boolean
        supported-header-compression-kind-list:
