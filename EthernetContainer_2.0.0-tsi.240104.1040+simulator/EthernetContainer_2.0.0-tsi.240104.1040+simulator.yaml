########################################################################################################################
#   Common Components
########################################################################################################################
components:
  responses:
    responseForErroredServiceRequests:
      description: 'Response in case of errored service requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
  schemas:
    errorDescription:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    ethernetContainerCapability:
      type: object
      properties:
        ethernet-container-2-0:ethernet-container-capability:
          type: object
          properties:
            available-queue-list:
              type: array
              minItems: 1
              maxItems: 8
              items:
                type: object
                properties:
                  queue-name:
                    enum:
                      - 'ethernet-container-2-0:QUEUE_NAME_TYPE_BEST_EFFORT_QUEUE'
                      - 'ethernet-container-2-0:QUEUE_NAME_TYPE_ASSURED_FORWARDING_QUEUE1'
                      - 'ethernet-container-2-0:QUEUE_NAME_TYPE_ASSURED_FORWARDING_QUEUE2'
                      - 'ethernet-container-2-0:QUEUE_NAME_TYPE_ASSURED_FORWARDING_QUEUE3'
                      - 'ethernet-container-2-0:QUEUE_NAME_TYPE_ASSURED_FORWARDING_QUEUE4'
                      - 'ethernet-container-2-0:QUEUE_NAME_TYPE_EXPEDITED_FORWARDING_QUEUE'
                      - 'ethernet-container-2-0:QUEUE_NAME_TYPE_CLASS_SELECTOR_QUEUE6'
                      - 'ethernet-container-2-0:QUEUE_NAME_TYPE_CLASS_SELECTOR_QUEUE7'
                      - 'ethernet-container-2-0:QUEUE_NAME_TYPE_QUEUENAME_NOT_YET_DEFINED'
                  supported-queue-depth-list:
                    type: array
                    items:
                      type: integer
                  available-dropping-behavior-kind-list:
                    type: array
                    items:
                      enum:
                        - 'ethernet-container-2-0:DROPPING_BEHAVIOR_KIND_TYPE_DROP_TAIL'
                        - 'ethernet-container-2-0:DROPPING_BEHAVIOR_KIND_TYPE_RED'
                        - 'ethernet-container-2-0:DROPPING_BEHAVIOR_KIND_TYPE_WRED'
                        - 'ethernet-container-2-0:DROPPING_BEHAVIOR_KIND_TYPE_NOT_YET_DEFINED'
                  available-drop-precedence-kind-list:
                    type: array
                    items:
                      enum:
                        - 'ethernet-container-2-0:DROP_PRECEDENCE_TYPE_ALL'
                        - 'ethernet-container-2-0:DROP_PRECEDENCE_TYPE_LOW'
                        - 'ethernet-container-2-0:DROP_PRECEDENCE_TYPE_MEDIUM'
                        - 'ethernet-container-2-0:DROP_PRECEDENCE_TYPE_HIGH'
                        - 'ethernet-container-2-0:DROP_PRECEDENCE_TYPE_NOT_YET_DEFINED'
                  wred-profile-per-drop-precedence-is-available:
                    type: boolean
                  available-scheduling-kind-list:
                    type: array
                    items:
                      enum:
                        - 'ethernet-container-2-0:SCHEDULER_KIND_TYPE_STRICT'
                        - 'ethernet-container-2-0:SCHEDULER_KIND_TYPE_WFQ'
                        - 'ethernet-container-2-0:SCHEDULER_KIND_TYPE_WRR'
                        - 'ethernet-container-2-0:SCHEDULER_KIND_TYPE_DWRR'
                        - 'ethernet-container-2-0:SCHEDULER_KIND_TYPE_NOT_YET_DEFINED'
                required:
                  - queue-name
                  - supported-queue-depth-list
                  - available-dropping-behavior-kind-list
                  - available-drop-precedence-kind-list
                  - wred-profile-per-drop-precedence-is-available
                  - available-scheduling-kind-list
            dropping-behavior-configuration-is-avail:
              type: boolean
            wred-profile-configuration-is-avail:
              type: boolean
            scheduler-kind-configuration-is-avail:
              type: boolean
            scheduler-profile-configuration-is-avail:
              type: boolean
            supported-wred-protocol-list:
              type: array
              items:
                enum:
                  - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_NONE'
                  - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_ETHERNET_MAC'
                  - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_VLAN'
                  - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_Q_IN_Q'
                  - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_MPLS'
                  - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_IPV4'
                  - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_IPV6'
                  - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_TCP'
                  - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_UDP'
                  - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_RTP'
                  - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_GTP_U'
                  - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_OTHERS'
                  - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_NOT_YET_DEFINED'
            explicit-congestion-notification-is-avail:
              type: boolean
            ingress-policing-is-avail:
              type: boolean
            egress-shaping-is-avail:
              type: boolean
            supported-maximum-information-rate-list:
              type: array
              items:
                type: integer
            supported-maximum-burst-size-list:
              type: array
              items:
                type: integer
            bundling-is-avail:
              type: boolean
            bundling-group-size-max:
              type: integer
            support-of-management-frames-without-preamble-is-avail:
              type: boolean
            supported-header-compression-kind-list:
              type: array
              items:
                type: object
                properties:
                  header-compression-name:
                    type: string
                  header-compression-mode:
                    enum:
                      - 'ethernet-container-2-0:HEADER_COMPRESSION_MODE_TYPE_AUTO'
                      - 'ethernet-container-2-0:HEADER_COMPRESSION_MODE_TYPE_PROTOCOL_BASED'
                      - 'ethernet-container-2-0:HEADER_COMPRESSION_MODE_TYPE_LENGTH_BASED'
                      - 'ethernet-container-2-0:HEADER_COMPRESSION_MODE_TYPE_NO_COMPRESSION'
                      - 'ethernet-container-2-0:HEADER_COMPRESSION_MODE_TYPE_NOT_YET_DEFINED'
                  compressed-protocol-layer-list:
                    type: array
                    items:
                      enum:
                        - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_NONE'
                        - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_ETHERNET_MAC'
                        - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_VLAN'
                        - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_Q_IN_Q'
                        - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_MPLS'
                        - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_IPV4'
                        - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_IPV6'
                        - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_TCP'
                        - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_UDP'
                        - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_RTP'
                        - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_GTP_U'
                        - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_OTHERS'
                        - 'ethernet-container-2-0:PROTOCOL_LAYER_TYPE_NOT_YET_DEFINED'
                  mpls-payload-kind-list:
                    type: array
                    items:
                      enum:
                        - 'ethernet-container-2-0:MPLS_PAYLOAD_KIND_TYPE_NONE'
                        - 'ethernet-container-2-0:MPLS_PAYLOAD_KIND_TYPE_AUTO'
                        - 'ethernet-container-2-0:MPLS_PAYLOAD_KIND_TYPE_ETH_O_MPLS'
                        - 'ethernet-container-2-0:MPLS_PAYLOAD_KIND_TYPE_IP_O_MPLS'
                        - 'ethernet-container-2-0:MPLS_PAYLOAD_KIND_TYPE_NOT_YET_DEFINED'
                  compressed-header-length:
                    type: integer
                required:
                  - header-compression-name
                  - header-compression-mode
                  - compressed-protocol-layer-list
                  - mpls-payload-kind-list
                  - compressed-header-length
            fec-is-avail:
              type: boolean
            fec-word-size-max:
              type: integer
            supported-fec-redundancy-size-list:
              type: array
              items:
                enum:
                  - 'ethernet-container-2-0:FEC_REDUNDANCY_SIZE_TYPE_2'
                  - 'ethernet-container-2-0:FEC_REDUNDANCY_SIZE_TYPE_4'
                  - 'ethernet-container-2-0:FEC_REDUNDANCY_SIZE_TYPE_8'
                  - 'ethernet-container-2-0:FEC_REDUNDANCY_SIZE_TYPE_16'
                  - 'ethernet-container-2-0:FEC_REDUNDANCY_SIZE_TYPE_20'
                  - 'ethernet-container-2-0:FEC_REDUNDANCY_SIZE_TYPE_NOT_YET_DEFINED'
            supported-fec-interleaver-kind-list:
              type: array
              items:
                enum:
                  - 'ethernet-container-2-0:FEC_INTERLEAVER_KIND_TYPE_NONE'
                  - 'ethernet-container-2-0:FEC_INTERLEAVER_KIND_TYPE_BLOCK'
                  - 'ethernet-container-2-0:FEC_INTERLEAVER_KIND_TYPE_CONVOLUTION'
                  - 'ethernet-container-2-0:FEC_INTERLEAVER_KIND_TYPE_NOT_YET_DEFINED'
            supported-fec-interleaver-depth-list:
              type: array
              items:
                enum:
                  - 'ethernet-container-2-0:FEC_INTERLEAVER_DEPTH_TYPE_1'
                  - 'ethernet-container-2-0:FEC_INTERLEAVER_DEPTH_TYPE_2'
                  - 'ethernet-container-2-0:FEC_INTERLEAVER_DEPTH_TYPE_3'
                  - 'ethernet-container-2-0:FEC_INTERLEAVER_DEPTH_TYPE_4'
                  - 'ethernet-container-2-0:FEC_INTERLEAVER_DEPTH_TYPE_6'
                  - 'ethernet-container-2-0:FEC_INTERLEAVER_DEPTH_TYPE_8'
                  - 'ethernet-container-2-0:FEC_INTERLEAVER_DEPTH_TYPE_12'
                  - 'ethernet-container-2-0:FEC_INTERLEAVER_DEPTH_TYPE_16'
                  - 'ethernet-container-2-0:FEC_INTERLEAVER_DEPTH_TYPE_24'
                  - 'ethernet-container-2-0:FEC_INTERLEAVER_DEPTH_TYPE_32'
                  - 'ethernet-container-2-0:FEC_INTERLEAVER_DEPTH_TYPE_48'
                  - 'ethernet-container-2-0:FEC_INTERLEAVER_DEPTH_TYPE_96'
                  - 'ethernet-container-2-0:FEC_INTERLEAVER_DEPTH_TYPE_NOT_YET_DEFINED'
            encryption-is-avail:
              type: boolean
            admin-shut-down-is-avail:
              type: boolean
            supported-loop-back-kind-list:
              type: array
